<!DOCTYPE html>
<html>
<head><title>ChezaStemEd</title><meta name="viewport" content="width=device-width, initial-scale=1"></head>
<body style="font-family:Arial;padding:20px;background:#f0f8ff;text-align:center">
<h1>ChezaStemEd is LIVE! 🚀</h1>
<p>If you see this, site is working!</p>
<a href="https://aistudio.google.com/app/apikey" target="_blank"><button style="padding:12px;background:blue;color:white;border-radius:8px">Get API Key</button></a>
<hr>
<input id="q" style="width:90%;padding:12px" placeholder="Ask e.g. What is photosynthesis?">
<button onclick="ask()" style="padding:12px;background:green;color:white;width:90%;margin-top:10px">Ask AI</button>
<div id="a" style="background:white;padding:15px;margin-top:15px;border-radius:8px;text-align:left;white-space:pre-wrap">Answer here...</div>

<script>
const KEY = "AQ.Ab8RN6IRhdSKH3vck2aFgSWDKPPw_ZLZK79ujdphssHw6W5nlg"; // replace this after
async function ask(){
  const question = document.getElementById('q').value;
  if(!question){alert("Type question");return;}
  document.getElementById('a').innerText="Thinking...";
  const url=`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${KEY}`;
  try{
    const r=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({contents:[{parts:[{text:question}]}]})});
    const d=await r.json();
    document.getElementById('a').innerText=d.candidates[0].content.parts[0].text;
  }catch(e){document.getElementById('a').innerText="Error: "+e+"\nCheck if you pasted key correctly at top of code";}
}
</script>
</body>
</html>
