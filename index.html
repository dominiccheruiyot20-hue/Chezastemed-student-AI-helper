<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width, initial-scale=1"><title>ChezaStemEd</title></head><body style="font-family:Arial;padding:15px;background:#f0f8ff;text-align:center">
<h2>ChezaStemEd LIVE! 🚀</h2>
<input id="k" type="password" style="width:95%;padding:12px;border:2px solid blue" placeholder="Paste API Key here then Save">
<br><button onclick="localStorage.setItem('k',document.getElementById('k').value);alert('Key saved privately!');document.getElementById('k').value='***saved***'" style="padding:8px;background:black;color:white;margin-top:5px">Save Key Privately</button>
<br><br><a href="https://aistudio.google.com/app/apikey" target="_blank"><button style="padding:8px;background:blue;color:white;border-radius:6px">Get API Key</button></a>
<hr>
<input id="q" style="width:95%;padding:12px;margin-top:10px" placeholder="Type question: What is data analytics?">
<button onclick="ask()" style="padding:12px;background:green;color:white;width:95%;margin-top:10px">Ask AI</button>
<div id="a" style="background:white;padding:15px;margin-top:15px;border-radius:8px;text-align:left;white-space:pre-wrap;min-height:50px">Answer will appear here...</div>
<script>
async function ask(){
  const KEY=document.getElementById('k').value||localStorage.getItem('k')||"";
  if(!KEY||KEY.includes('***')){const s=localStorage.getItem('k'); if(!s){alert("Paste key first!");return;}}
  const realKey=localStorage.getItem('k')||document.getElementById('k').value;
  const qq=document.getElementById('q').value; if(!qq){alert("Type question");return;}
  document.getElementById('a').innerText="Thinking...";
  const url=`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${realKey.trim()}`;
  try{
    const r=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({contents:[{parts:[{text:qq}]}]})});
    const d=await r.json();
    if(d.error){document.getElementById('a').innerText="Error: "+d.error.message;return;}
    document.getElementById('a').innerText=d.candidates[0].content.parts[0].text;
  }catch(e){document.getElementById('a').innerText="Failed: "+e;}
}
window.onload=()=>{const s=localStorage.getItem('k'); if(s) document.getElementById('k').placeholder="Key saved *** - you can ask now";}
</script></body></html>
<div>
  <h3>Learn Mode</h3>
  <textarea id="notes" placeholder="Paste your notes here..."></textarea>
  <button onclick="makeQuiz()">Make Quiz</button>
  <div id="quiz"></div>
</div>

<script>
async function makeQuiz(){
  const notes = document.getElementById('notes').value;
  document.getElementById('quiz').innerHTML = "Generating quiz...";
  // Replace with your AI API call
  // For now simple logic:
  const questions = notes.split('.').slice(0,3).map(s => 
    `What do you remember about: ${s}? <input><br><br>`
  ).join('');
  document.getElementById('quiz').innerHTML = questions;
}
</script>
